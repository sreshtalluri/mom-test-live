name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang libclang-dev ffmpeg
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV'
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Real terminal consent and import tests
        if: runner.os != 'Windows'
        run: python scripts/e2e.py --binary target/debug/mom-test-live
      - name: Download verified test model
        run: cargo run --release --locked -- models download base
      - name: Real offline inference on every platform
        run: cargo test --release --locked transcribes_real_recorded_speech_offline -- --ignored
      - name: Codec and terminal audio tests
        if: runner.os == 'Linux'
        run: python scripts/e2e.py --binary target/release/mom-test-live --audio
